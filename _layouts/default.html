<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <!-- Bootstrap CSS -->

            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            crossorigin="anonymous"
        />

        <!-- Your compiled CSS (from assets/css/style.scss) -->
        <link
            rel="stylesheet"
            href="{{ '/assets/css/style.css' | relative_url }}"
        />
        <link
            rel="icon"
            href="{{ '/assets/images/cylogo.svg' | relative_url }}"
            type="image/svg+xml"
        />
    </head>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        /* Hide raw blocks to avoid the code-box flash before render */
        pre code.language-mermaid,
        .highlight code.language-mermaid {
            display: none;
        }
    </style>
    <script>
        ;(function () {
            const prefersDark = window.matchMedia?.(
                '(prefers-color-scheme: dark)'
            ).matches
            mermaid.initialize({
                startOnLoad: false,
                theme: prefersDark ? 'dark' : 'default',
            })

            function convertAndRender() {
                // Works whether Rouge wrapped it (<div class="highlight"><pre><code…>) or not
                const blocks = document.querySelectorAll(
                    'code.language-mermaid, pre code.language-mermaid, .highlight code.language-mermaid'
                )

                blocks.forEach(code => {
                    const graph = code.textContent
                    const container = document.createElement('div')
                    container.className = 'mermaid'
                    container.textContent = graph

                    const pre = code.closest('pre')
                    const highlight = code.closest('.highlight')
                    ;(highlight || pre || code).replaceWith(container)
                })

                mermaid.run({ querySelector: '.mermaid' })
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', convertAndRender)
            } else {
                convertAndRender()
            }
        })()
    </script>
    <body class="bg-dark text-light">

                        <!-- <li class="nav-item">

        <!-- Bootstrap JS (optional components) -->

        ></script>
