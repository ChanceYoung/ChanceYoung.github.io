<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>{{ page.title | default: site.title }}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            crossorigin="anonymous"
        />

        <!-- Your compiled CSS (from assets/css/style.scss) -->
        <link
            rel="stylesheet"
            href="{{ '/assets/css/style.css' | relative_url }}"
        />
        <link
            rel="icon"
            href="{{ '/assets/images/cylogo.svg' | relative_url }}"
            type="image/svg+xml"
        />
    </head>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'
        mermaid.initialize({ startOnLoad: true })
        document
            .querySelectorAll('pre > code.language-mermaid')
            .forEach(codeBlock => {
                codeBlock.parentElement.outerHTML = `<pre class="mermaid">${codeBlock.textContent}</pre>`
            })
    </script>
    <body class="bg-dark text-light">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-md navbar-dark border-0">
            <!-- Codewars badge (micro version) -->

            <div class="container">
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navMain"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <img
                    src="/assets/images/cylogo.svg"
                    alt="CY.dev logo"
                    style="width: 36px"
                />

                <div id="navMain" class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{{ '/' | relative_url }}"
                                >Home</a
                            >
                        </li>
                        <!-- <li class="nav-item">
                    <a class="nav-link" href="{{ '/projects/' | relative_url }}">Projects</a>
                </li> -->
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{{ '/assets/downloadables/ChanceYoungResume 9_3_25.pdf' | relative_url }}"
                                download
                            >
                                Resume
                            </a>
                        </li>
                    </ul>
                </div>
                <a
                    class="nav-link p-0 me-2"
                    href="https://www.codewars.com/users/ChanceYoung"
                    target="_blank"
                    rel="noopener"
                >
                    <img
                        src="https://www.codewars.com/users/ChanceYoung/badges/large"
                        alt="Codewars badge"
                    />
                </a>
            </div>
        </nav>

        <!-- Main -->
        <main class="container my-4">{{ content }}</main>

        <!-- Footer -->
        <footer class="py-4 border-0">
            <div class="container text-center text-secondary small">
                © {{ site.time | date: '%Y' }} {{ site.title }}
            </div>
        </footer>

        <!-- Bootstrap JS (optional components) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"
        ></script>
        <!-- Your JS -->
        <!-- <script src="{{ '/assets/js/site.js' | relative_url }}"></script> -->
    </body>
</html>
